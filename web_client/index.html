<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZeepubBot Web</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            primary: 'var(--color-primary)',
            'primary-dark': 'var(--color-primary-dark)',
            'telegram-blue': 'var(--color-primary)',
            background: '#101622',
            'background-light': '#f6f6f8',
            surface: '#121212',
            'surface-highlight': '#1E1E1E',
            border: 'rgba(255, 255, 255, 0.08)',
            // New Catalog Colors
            "amoled-bg": "#000000",
            "amoled-surface": "#121212",
            "amoled-border": "#27272a",
            "accent": "#10B981",
            // Book Detail Specifics
            "background-dark": "#080b0e",
            "surface-dark": "#12171c",
            // Request Book & Telegram Specifics
            telegram: {
              star: "#FFD700",
              ton: "#0098EA",
            }
          },
          animation: {
            'spin-slow': 'spin 3s linear infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.1)',
            'glow': '0 0 15px rgba(51, 144, 236, 0.3)',
            'star-glow': '0 0 20px rgba(255, 215, 0, 0.2)',
          },
          backgroundImage: {
            'hero-pattern': "url('https://images.unsplash.com/photo-1541963463532-d68292c34b19?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80')",
          }
        },
      },
    }
  </script>
  <style>
    :root {
      --color-primary: #2b6cee;
      --color-primary-dark: #1a4bb0;

      /* Base Glass Settings (Default) */
      --glass-opacity: 0.6;
      --glass-blur: 12px;
      --glass-border-opacity: 0.08;

      /* Theme Defaults */
      --app-bg: #050505;
      --glass-rgb: 30, 35, 45;
      --bg-color: #101622;
      --card-color: rgba(30, 35, 45, 0.6);
      /* Dark glass base */
    }

    /* Light Theme Overrides */
    :root:not(.dark) {
      --app-bg: #f0f2f5;
      --glass-rgb: 255, 255, 255;
      /* White glass base */
      --glass-border-opacity: 0.2;
    }

    /* AMOLED Theme Overrides */
    .amoled {
      --app-bg: #000000;
      --glass-rgb: 0, 0, 0;
      --glass-opacity: 1 !important;
      /* Force opaque for AMOLED */
      --glass-blur: 0px !important;
      /* No blur for AMOLED */
      --glass-border-opacity: 0.15;
    }

    /* Global scrollbar styling */
    body {
      background-color: var(--bg-color);
      overscroll-behavior-y: none;
      transition: background-color 0.3s ease;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-primary);
    }

    /* 
      CORE GLASS CLASS 
      - Uses variables for runtime configurability 
      - Handles the "crystal" look
    */
    .glass-panel,
    .glass-card {
      /* Base background using RGB variable and Opacity variable */
      background: var(--card-color);

      /* Blur effect */
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));

      /* Border handling */
      border: 1px solid rgba(255, 255, 255, var(--glass-border-opacity));

      /* Shadows */
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);

      /* Transition for smooth settings updates */
      transition: all 0.2s ease-in-out;
    }

    /* Light mode border adjustment */
    :root:not(.dark) .glass-panel,
    :root:not(.dark) .glass-card {
      border-color: rgba(0, 0, 0, 0.05);
      /* Darker border for visibility on light */
    }

    /* AMOLED Specific Overrides for Panels */
    .amoled .glass-panel,
    .amoled .glass-card {
      background: #000000 !important;
      /* Pure black */
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-color: #333 !important;
      /* Visible generic border */
    }

    /* Text Compatibility Helpers */
    html:not(.dark) .text-white {
      color: #111827 !important;
    }

    html:not(.dark) .text-gray-100 {
      color: #111827 !important;
    }

    html:not(.dark) .text-gray-200 {
      color: #1f2937 !important;
    }

    html:not(.dark) .text-gray-300 {
      color: #374151 !important;
    }

    html:not(.dark) .text-gray-400 {
      color: #4b5563 !important;
    }

    html:not(.dark) .text-gray-500 {
      color: #6b7280 !important;
    }

    html:not(.dark) .bg-white\/5 {
      background-color: rgba(0, 0, 0, 0.05) !important;
    }

    html:not(.dark) .bg-white\/10 {
      background-color: rgba(0, 0, 0, 0.1) !important;
    }

    html:not(.dark) .border-white\/5 {
      border-color: rgba(0, 0, 0, 0.05) !important;
    }

    html:not(.dark) .border-white\/10 {
      border-color: rgba(0, 0, 0, 0.1) !important;
    }

    html:not(.dark) .bg-black\/20 {
      background-color: rgba(0, 0, 0, 0.05) !important;
    }

    /* Custom Input Range */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--color-primary);
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 0 4px rgba(var(--glass-rgb), 0.5);
      /* Adaptive shadow ring */
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(128, 128, 128, 0.3);
      border-radius: 2px;
    }

    .glass-backdrop::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -10;
      background-size: cover;
      background-position: center;
      opacity: 0.2;
      filter: blur(64px);
      transform: scale(1.25);
      background-image: inherit;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

<body
  class="bg-background-light dark:bg-background text-gray-900 dark:text-gray-100 antialiased overflow-hidden font-sans selection:bg-primary selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
