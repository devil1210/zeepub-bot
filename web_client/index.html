<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- Telegram Mini App Optimizations -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Performance: DNS Prefetch & Preconnect -->
  <link rel="dns-prefetch" href="https://telegram.org" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />

  <link rel="preconnect" href="https://telegram.org" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Critical: Telegram Web App SDK (Preload) -->
  <link rel="preload" href="https://telegram.org/js/telegram-web-app.js" as="script" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>ZeepubBot Web</title>

  <!-- Fonts: Optimized Loading with font-display swap -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          borderRadius: {
            'premium': 'var(--radius-premium)',
            'premium-lg': 'calc(var(--radius-premium) * 1.5)',
            'premium-sm': 'calc(var(--radius-premium) * 0.7)',
          },
          colors: {
            primary: 'var(--color-primary)',
            'primary-dark': 'var(--color-primary-dark)',
            'telegram-blue': 'var(--color-primary)',
            background: '#0a0a0c',
            'background-light': '#f6f6f8',
            surface: 'rgba(255, 255, 255, 0.03)',
            'surface-highlight': 'rgba(255, 255, 255, 0.08)',
            border: 'rgba(255, 255, 255, 0.08)',
            // Premium Brand Palette
            brand: {
              50: '#f0f4ff',
              100: '#e0e9ff',
              200: '#c1d3ff',
              300: '#92b3ff',
              400: '#5c8bff',
              500: '#2b6cee',
              600: '#1a4bb0',
              700: '#153a8a',
              800: '#122e6e',
              900: '#11275d',
            },
            // New Catalog Colors
            "amoled-bg": "#000000",
            "amoled-surface": "#121212",
            "amoled-border": "#27272a",
            "accent": "#10B981",
            // Book Detail Specifics
            "background-dark": "#080b0e",
            "surface-dark": "#12171c",
            // Request Book & Telegram Specifics
            telegram: {
              star: "#FFD700",
              ton: "#0098EA",
            }
          },
          animation: {
            'spin-slow': 'spin 3s linear infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'shimmer': 'shimmer 2s linear infinite',
            'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scale-in': 'scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            fadeInUp: {
              '0%': { opacity: 0, transform: 'translateY(20px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            scaleIn: {
              '0%': { opacity: 0, transform: 'scale(0.95)' },
              '100%': { opacity: 1, transform: 'scale(1)' },
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.1)',
            'glow': '0 0 25px rgba(var(--color-primary-rgb), 0.3)',
            'premium': '0 20px 50px rgba(0, 0, 0, 0.3)',
            'star-glow': '0 0 20px rgba(255, 215, 0, 0.2)',
          },
          backgroundImage: {
            'hero-pattern': "url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop')",
          }
        },
      },
    }
  </script>
  <style>
    :root {
      --color-primary: #2b6cee;
      --color-primary-dark: #1a4bb0;

      /* Base Glass Settings (Default / Pro Max) */
      --glass-opacity: 0.6;
      --glass-blur: 12px;
      /* Enterprise Standard v3.5.0 */
      --glass-border-opacity: 0.05;

      /* Theme Defaults */
      --app-bg: #050505;
      --glass-rgb: 30, 35, 45;
      --bg-color: #101622;
      --card-color: rgba(30, 35, 45, 0.6);

      --radius-premium: 24px;
      --border-width-premium: 1px;
      --panel-bg: var(--card-color);
      --panel-bg-subtle: rgba(var(--glass-rgb), 0.4);
      --panel-border: rgba(255, 255, 255, var(--glass-border-opacity));
      --panel-border-hover: rgba(var(--color-primary-rgb), 0.3);
    }

    /* Light Theme Overrides */
    :root:not(.dark) {
      --app-bg: #f0f2f5;
      --glass-rgb: 255, 255, 255;
      /* White glass base */
      --glass-border-opacity: 0.2;
    }

    /* AMOLED Theme Overrides */
    .amoled {
      --app-bg: #000000;
      --glass-rgb: 0, 0, 0;
      --glass-opacity: 1 !important;
      /* Force opaque for AMOLED */
      --glass-blur: 0px !important;
      /* No blur for AMOLED */
      --glass-border-opacity: 0.15;
    }

    /* Global scrollbar styling */
    body {
      background-color: var(--bg-color);
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      /* Critical for iOS fluid scroll */
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    ::-webkit-scrollbar {
      width: 4px;
      /* Thinner */
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      transition: background 0.3s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* 
      CORE GLASS CLASS 
      - Uses variables for runtime configurability 
      - Handles the "crystal" look
      - Optimized for mobile GPU (no unnecessary composite layers)
    */
    .glass-panel,
    .glass-card {
      /* Base background using thematic panel variable */
      background: var(--panel-bg);

      /* Radius and Border from Theme */
      border-radius: var(--radius-premium);

      /* Blur effect — Desktop uses full quality */
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation, 180%));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation, 180%));

      /* Liquid Glass Border Standard (Biselado dinámico) */
      border: var(--border-width-premium) solid transparent;
      background-clip: padding-box, border-box;
      background-image:
        linear-gradient(var(--panel-bg), var(--panel-bg)),
        linear-gradient(to bottom right, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));

      /* Refuerzo de consistencia: fondo base para evitar transparencia excesiva en tarjetas */
      background-color: var(--bg-color);

      /* Shadows — Lightweight for mobile */
      box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.2);

      /* Transitions: lightweight, no GPU layer promotion by default */
      transition:
        box-shadow 0.2s ease,
        background-color 0.2s ease,
        border-color 0.2s ease;
    }

    .glass-panel:hover {
      border-color: var(--panel-border-hover);
    }

    /* Sub-panels or nested cards */
    .glass-panel-sub {
      background: var(--panel-bg-subtle);
      border: 1px solid var(--panel-border);
      border-radius: 1.5rem;
    }

    /* Custom scrollbar for horizontal lists */
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      display: block !important;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--color-primary);
      border-radius: 10px;
      opacity: 0.5;
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: var(--color-primary) transparent;
    }

    /* Light mode border adjustment */
    :root:not(.dark) .glass-panel,
    :root:not(.dark) .glass-card {
      border-color: rgba(0, 0, 0, 0.05);
      /* Darker border for visibility on light */
    }

    /* AMOLED Specific Overrides for Panels */
    .amoled .glass-panel,
    .amoled .glass-card {
      background: #000000 !important;
      /* Pure black */
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-color: #333 !important;
      /* Visible generic border */
    }

    /* Text Compatibility Helpers */
    html:not(.dark) .text-white {
      color: #111827 !important;
    }

    html:not(.dark) .text-gray-100 {
      color: #111827 !important;
    }

    html:not(.dark) .text-gray-200 {
      color: #1f2937 !important;
    }

    html:not(.dark) .text-gray-300 {
      color: #374151 !important;
    }

    html:not(.dark) .text-gray-400 {
      color: #4b5563 !important;
    }

    html:not(.dark) .text-gray-500 {
      color: #6b7280 !important;
    }

    html:not(.dark) .bg-white\/5 {
      background-color: rgba(0, 0, 0, 0.05) !important;
    }

    html:not(.dark) .bg-white\/10 {
      background-color: rgba(0, 0, 0, 0.1) !important;
    }

    html:not(.dark) .border-white\/5 {
      border-color: rgba(0, 0, 0, 0.05) !important;
    }

    html:not(.dark) .border-white\/10 {
      border-color: rgba(0, 0, 0, 0.1) !important;
    }

    html:not(.dark) .bg-black\/20 {
      background-color: rgba(0, 0, 0, 0.05) !important;
    }

    /* Custom Input Range */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--color-primary);
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 0 4px rgba(var(--glass-rgb), 0.5);
      /* Adaptive shadow ring */
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(128, 128, 128, 0.3);
      border-radius: 2px;
    }

    .glass-backdrop::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -10;
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      filter: blur(32px);
      transform: scale(1.1);
      background-image: inherit;
    }

    /* === EXTREME MOBILE PERFORMANCE (Target: 60/120fps Stable) === */
    @media (max-width: 768px) {

      /* Global Reset for Performance */
      * {
        box-shadow: none !important;
        /* Shadows are expensive to rasterize */
        text-shadow: none !important;
        filter: none !important;
        /* No blur, no brightness filters */
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        transition: opacity 0.1s linear, transform 0.1s linear !important;
        /* Only simple transitions */
        animation: none !important;
        /* Kill all keyframe animations */
      }

      /* Force Hardware Acceleration OFF for flows, but ON for scroll */
      .glass-panel,
      .glass-card,
      div {
        /* Remove transparent gradients that cause overdraw */
        background-image: none !important;
        border-image: none !important;
      }

      .glass-panel,
      .glass-card {
        /* Flat, solid, fast rendering */
        background-color: #1e293b !important;
        /* Fallback Slate-800 */
        background: #1e293b !important;

        /* Simple thin border, no gradient border */
        border: 1px solid #334155 !important;
        /* Slate-700 */

        /* Optional: Hint browser to optimize layout */
        contain: content;
      }

      /* Dark/Amoled Handling */
      .dark .glass-panel,
      .dark .glass-card {
        background-color: #111827 !important;
        /* Gray-900 */
        border-color: #1f2937 !important;
      }

      .amoled .glass-panel,
      .amoled .glass-card {
        background-color: #000000 !important;
        border-color: #1a1a1a !important;
      }

      /* Disable the large background blob entirely */
      .glass-backdrop,
      .glass-backdrop::before {
        display: none !important;
      }

      /* Ensure text is standard rendering for speed */
      body {
        text-rendering: optimizeSpeed;
      }
    }

    /* Users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {

      .glass-panel,
      .glass-card {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        transition: none !important;
      }

      .glass-backdrop::before {
        filter: none;
      }
    }
  </style>
</head>

<body
  class="text-gray-900 dark:text-gray-100 antialiased overflow-hidden font-sans selection:bg-primary selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/app/index.tsx"></script>
</body>

</html>
