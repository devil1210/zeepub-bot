server {
    listen 80;
    server_name _;

    # Tamaño máximo de cuerpo de solicitud (para subida de EPUBs)
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # DNS resolver interno de Docker (evita error 502 al cambiar IP el contenedor)
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://zeepubs_bot:8000;

    # Enrutamiento SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy inverso para las peticiones API al backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_cache_bypass $http_upgrade;

        # Timeouts extendidos para uploads grandes (subida + WebDAV a Nextcloud)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_max_body_size  100M;
    }

    # Caching de activos estáticos del frontend (excluyendo la API y portadas)
    location ~* ^/(?!api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
