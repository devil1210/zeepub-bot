services:
  zeepubs_bot:
    image: ghcr.io/devil1210/zeepub-bot:${BOT_IMAGE_TAG:-v6-alpha}
    container_name: zeepubs_bot_v6
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # La ruta del host se define en el .env como HOST_LIB_PATH
      - ${HOST_LIB_PATH}:/library:ro
    environment:
      - LOG_LEVEL=INFO
      - GIT_BRANCH=feat/integrate-web-client
    ports:
      - "${DEV_PORT:-8001}:8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  zeepubs_web:
    image: ghcr.io/devil1210/zeepub-web:${WEB_IMAGE_TAG:-latest}
    container_name: zeepub_web_v6
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - zeepubs_bot
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower_v6
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:-zeepub_secret}
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.40
    command: --interval 300 --label-enable
