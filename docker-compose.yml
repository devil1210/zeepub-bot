services:
  zeepubs_bot:
    build: .
    image: ghcr.io/devil1210/zeepub-bot:feat-integrate-web-client
    container_name: zeepubs_bot_v6
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # La ruta del host se define en el .env como HOST_LIB_PATH
      - ${HOST_LIB_PATH}:/library:rw
    environment:
      # Construcción dinámica de la URL de DB usando las variables del .env
      - ENABLE_POSTGRES_PLUGIN=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - URL_CACHE_DB_PATH=data/url_cache.db

    # Dependencia de la DB
    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${DEV_PORT:-8000}:8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
  # Servicio Frontend Web (Nginx + React SPA)
  zeepubs_web:
    build:
      context: ./web_client
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_ENABLE_DEBUG_ADMIN=${VITE_ENABLE_DEBUG_ADMIN}
    image: ghcr.io/devil1210/zeepub-web:latest
    container_name: zeepub_web_v6
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - zeepubs_bot

  # Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: zeepub_db_v6
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zeepub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeepub}
      POSTGRES_DB: ${POSTGRES_DB:-zeepub}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeepub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Exponer puerto solo si es necesario (útil para debug remoto)
      - "${POSTGRES_PORT:-5432}:5432"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower_v6
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_MONITOR_ONLY=${WATCHTOWER_MONITOR_ONLY:-false}
      - WATCHTOWER_DEBUG=false
      - DOCKER_API_VERSION=1.52
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 30 --label-enable
