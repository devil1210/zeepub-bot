services:
  zeepubs_bot:
    image: ghcr.io/devil1210/zeepub-bot:${BOT_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-zeepubs_bot_v4}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ${HOST_LIB_PATH}:/library:rw
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - LIBRARY_PATH=/library
      - DATA_PATH=/app/data
      - RUN_MIGRATION=${RUN_MIGRATION:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DEV_PORT:-8001}:8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: pgvector/pgvector:pg17
    container_name: zeepub_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower_v6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_MONITOR_ONLY=${WATCHTOWER_MONITOR_ONLY:-false}
      - WATCHTOWER_DEBUG=false
      - DOCKER_API_VERSION=1.47
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 30 --label-enable
