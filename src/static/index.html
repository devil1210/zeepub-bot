<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Dashboard | ZeePub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="dashboard-container">
        <header class="dashboard-header">
            <div class="logo-area">
                <span class="nexus-badge">CORE</span>
                <h1>Nexus<span>Dashboard</span></h1>
            </div>
            <div id="connection-status" class="status-indicator">
                <span class="pulse"></span> ONLINE
            </div>
        </header>

        <section class="metrics-grid">
            <!-- Sistema -->
            <div class="glass-card metric-card">
                <div class="card-header">
                    <span class="icon">🖥️</span>
                    <h3>Procesador</h3>
                </div>
                <div class="value-container">
                    <span id="cpu-value" class="main-value">0%</span>
                    <div class="progress-bar"><div id="cpu-progress" class="fill"></div></div>
                </div>
            </div>

            <div class="glass-card metric-card">
                <div class="card-header">
                    <span class="icon">🧠</span>
                    <h3>Memoria RAM</h3>
                </div>
                <div class="value-container">
                    <span id="ram-value" class="main-value">0 MB</span>
                    <span class="sub-label">Uso de Proceso</span>
                </div>
            </div>

            <!-- Servicios -->
            <div class="glass-card metric-card">
                <div class="card-header">
                    <span class="icon">📚</span>
                    <h3>Librería</h3>
                </div>
                <div class="value-container">
                    <span id="total-books" class="main-value">0</span>
                    <span class="sub-label">Libros Registrados</span>
                </div>
            </div>

            <div class="glass-card metric-card">
                <div class="card-header">
                    <span class="icon">✨</span>
                    <h3>Normalización IA</h3>
                </div>
                <div class="value-container">
                    <span id="pending-ia" class="main-value">0</span>
                    <span class="sub-label">Pendientes de Gemini</span>
                </div>
            </div>
        </section>

        <section class="system-logs glass-card">
            <div class="card-header">
                <span class="icon">🛰️</span>
                <h3>Información del Sistema</h3>
            </div>
            <div class="log-info">
                <div class="info-row">
                    <span>Uptime del Motor</span>
                    <span id="uptime" class="highlight">0s</span>
                </div>
                <div class="info-row">
                    <span>Versión de Núcleo</span>
                    <span id="version" class="highlight">Nexus-Skeleton v2.0</span>
                </div>
                <div class="info-row">
                    <span>Última Sincronización</span>
                    <span id="last-sync" class="highlight">--:--:--</span>
                </div>
            </div>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
